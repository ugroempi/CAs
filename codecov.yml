comment: false

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
        informational: true
    patch:
      default:
        target: auto
        threshold: 1%
        informational: true
flag_management:
  default_rules:
    carryforward: true  # Nimmt ältere Flag-Daten automatisch mit, falls ein Typ im aktuellen Build nicht separat benannt wird
